build-test:
  stage: deploy
  script:
    - mvn clean package -DskipTests -Dspring.config.location=/opt/esup-agape-test/application-test.properties
    - sudo systemctl stop esup-agape-test.service
    - rm -f /opt/esup-agape-test/esup-agape.jar
    - cp target/esup-agape.jar /opt/esup-agape-test/
    - sudo systemctl restart esup-agape-test.service
  only:
    - test
  tags:
    - test

build-prod:
  stage: deploy
  script:
    - mvn clean package -DskipTests -Dspring.config.location=/opt/esup-agape/application.properties
    - sudo systemctl stop esup-agape.service
    - rm -f /opt/esup-agape/esup-agape.jar
    - cp target/esup-agape.jar /opt/esup-agape/
    - sudo systemctl restart esup-agape.service
  only:
    - tags
  except:
    - dev
    - test
    - main
  tags:
    - prod
